[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-bid-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["markdown-it-py>=4,<5", "langsmith==0.14.12", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7", "httpx>=0.28,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-core>=1,<2", "python-docx>=1.1,<2", "pypdf>=5,<7", "pdfplumber>=0.11,<0.12", "openpyxl>=3.1,<4", "numpy>=2,<3", "faiss-cpu>=1.10,<2", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
embedding = ["sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
